# GitHub Pages 静态部署：只上传官网所需文件，避免整仓打包失败
name: Deploy Official Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包静态站点（仅 index / assets / svg）
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets _site/
          cp *.svg _site/ 2>/dev/null || true
          echo "站点文件："
          find _site -type f

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
