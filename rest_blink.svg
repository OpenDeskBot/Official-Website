<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="homepage style rest blink">
  <title>homepage style rest blink</title>
  <!-- transparent canvas for reuse -->
  <rect x="0" y="0" width="320" height="240" fill="transparent"/>
  <!-- only two eyes and one mouth, no round face -->
  <g id="avatar-core">
    <!-- open eyes -->
    <g id="eyes-open" fill="#ffffff">
      <circle cx="128" cy="102" r="4.7">
        <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="1;1;1;0;0;1;1" keyTimes="0;0.80;0.84;0.86;0.91;0.95;1"/>
      </circle>
      <circle cx="192" cy="102" r="4.7">
        <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="1;1;1;0;0;1;1" keyTimes="0;0.80;0.84;0.86;0.91;0.95;1"/>
      </circle>
    </g>
    <!-- closed eyes -->
    <g id="eyes-closed" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" fill="none">
      <line x1="120" y1="102" x2="136" y2="102">
        <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="0;0;0;1;1;0;0" keyTimes="0;0.80;0.84;0.86;0.91;0.95;1"/>
      </line>
      <line x1="184" y1="102" x2="200" y2="102">
        <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="0;0;0;1;1;0;0" keyTimes="0;0.80;0.84;0.86;0.91;0.95;1"/>
      </line>
    </g>
    <!-- rest mouth -->
    <rect x="150.5" y="138.5" width="19" height="12" rx="4.2" ry="4.2" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
